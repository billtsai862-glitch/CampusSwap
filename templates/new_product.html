{% extends "base.html" %}{% block title %}刊登商品｜CampusSwap{% endblock %}
{% block content %}<div class="form-page"><div class="form-heading"><span class="eyebrow">SHARE SOMETHING GOOD</span><h1>刊登你的好物</h1><p>讓閒置物品找到需要它的新主人。</p></div><section class="form-card"><form method="post">
<label>商品名稱 <span>*</span></label><input name="title" maxlength="80" required placeholder="例如：微積分上冊、無線滑鼠">
<label>商品分類 <span>*</span></label><select name="category" required><option value="">選擇商品分類</option><option>課本參考書</option><option>文具用品</option><option>3C 電子</option><option>生活用品</option><option>服飾配件</option><option>運動休閒</option><option>其他</option></select>
<label>販售價格（NT$） <span>*</span></label><input type="number" name="price" min="0" required placeholder="輸入價格">
<label>商品狀況 <span>*</span></label><select name="condition_text" required><option value="">選擇商品狀況</option><option>全新</option><option>近全新</option><option>保存良好</option><option>有使用痕跡</option></select>
<label>商品圖片網址 <small>選填，需為公開圖片連結</small></label><input type="url" name="image_url" placeholder="https://example.com/image.jpg">
<label>商品描述 <small>選填，最多 1000 字</small></label><textarea name="description" rows="5" maxlength="1000" placeholder="介紹商品特色、使用狀況、面交方式等"></textarea>
<div class="form-actions"><a class="button button-light" href="{{ url_for('index') }}">取消</a><button class="button button-primary" type="submit">發布商品 →</button></div>
</form></section></div>{% endblock %}
